name: Build original Geometry Dash level

on:
  push:
    branches:
      - gd-reference-analysis
    paths:
      - "build-original-gd.py"
      - ".github/workflows/build-original-gd.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gd-reference-analysis
      - name: Generate level and original soundtrack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 build-original-gd.py
      - name: Commit deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Build original Afterimage Geometry Dash level and soundtrack" || true
          git push origin HEAD:gd-reference-analysis
