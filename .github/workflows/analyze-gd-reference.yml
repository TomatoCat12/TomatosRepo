name: Analyze Geometry Dash reference

on:
  push:
    branches:
      - gd-reference-analysis
    paths-ignore:
      - "analysis/**"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gd-reference-analysis
      - name: Inspect level start object
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib,xml.etree.ElementTree as ET
          b64=pathlib.Path("README.md").read_text().strip()
          outer=gzip.decompress(base64.urlsafe_b64decode(b64+"="*((4-len(b64)%4)%4)))
          root=ET.fromstring(outer)
          d=list(root.find("dict"))
          vals={}
          for i in range(0,len(d),2):
              k=d[i].text or ""; v=d[i+1]
              vals[k]=v.text or ""
          raw=gzip.decompress(base64.urlsafe_b64decode(vals["k4"]+"="*((4-len(vals["k4"])%4)%4))).decode()
          first=raw.split(";",1)[0]
          pathlib.Path("analysis/start-segment.txt").write_text(first)
          print("FIRST SEGMENT:",first[:5000])
          print("RAW PREFIX:",raw[:6000])
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/start-segment.txt
          git commit -m "Inspect Geometry Dash start segment" || true
          git push origin HEAD:gd-reference-analysis
