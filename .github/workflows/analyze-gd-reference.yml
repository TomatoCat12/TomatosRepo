name: Analyze Geometry Dash reference

on:
  push:
    branches:
      - gd-reference-analysis
    paths-ignore:
      - "analysis/**"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: gd-reference-analysis

      - name: Decode nested level data and analyze object properties
        run: |
          set -euo pipefail
          mkdir -p analysis
          python3 - <<'PY'
          import base64, gzip, pathlib, json, collections, xml.etree.ElementTree as ET
          encoded = pathlib.Path("README.md").read_text(encoding="utf-8").strip()
          wrapper = gzip.decompress(base64.b64decode(encoded, altchars=b"-_"))
          root = ET.fromstring(wrapper)
          children = list(root.find("dict"))
          outer = {}
          for i in range(0, len(children), 2):
              k, v = children[i].text or "", children[i+1]
              if v.tag in ("s", "k"): value = v.text or ""
              elif v.tag in ("i", "r"): value = int(v.text or "0")
              elif v.tag == "d": value = float(v.text or "0")
              elif v.tag in ("t", "true"): value = True
              elif v.tag in ("f", "false"): value = False
              else: value = ET.tostring(v, encoding="unicode")
              outer[k] = value
          raw = gzip.decompress(base64.b64decode(outer["k4"], altchars=b"-_"))
          text = raw.decode("utf-8", errors="replace")
          records = text.split(";")
          property_counts = collections.Counter()
          object_ids = collections.Counter()
          trigger_ids = {"899","901","1006","1007","1049","1268","1346","1347","1616","1812","1814","1815"}
          triggers = []
          x_bins = collections.Counter()
          trigger_x_bins = collections.Counter()
          x_vals, y_vals = [], []
          for rec in records:
              a = rec.split(",")
              if len(a) < 6 or len(a) % 2: continue
              d = dict(zip(a[::2], a[1::2]))
              if "1" not in d: continue
              oid = d["1"]
              object_ids[oid] += 1
              property_counts.update(d.keys())
              try:
                  x, y = float(d["2"]), float(d["3"])
                  x_vals.append(x); y_vals.append(y)
                  x_bins[int(x // 500) * 500] += 1
                  if oid in trigger_ids:
                      trigger_x_bins[int(x // 500) * 500] += 1
              except (KeyError, ValueError): x = None
              if oid in trigger_ids and len(triggers) < 300:
                  triggers.append({k:d.get(k) for k in ("1","2","3","6","20","21","24","25","28","29","30","35","36","51","57","62","71","80","81","96","100","101","108","126","128","129","155","159") if k in d})
          out = {
              "level_name": outer.get("k2"), "level_version": outer.get("kCEK"),
              "song_id": outer.get("k45"), "decoded_bytes": len(raw),
              "object_records": sum(object_ids.values()),
              "object_id_counts": object_ids.most_common(100),
              "property_key_frequency": property_counts.most_common(100),
              "x_extent": [min(x_vals), max(x_vals)], "y_extent": [min(y_vals), max(y_vals)],
              "objects_per_500_x": sorted(x_bins.items()),
              "triggers_per_500_x": sorted(trigger_x_bins.items()),
              "trigger_samples_first_300": triggers
          }
          pathlib.Path("analysis/deep-analysis.json").write_text(json.dumps(out, indent=2), encoding="utf-8")
          print(json.dumps({k:v for k,v in out.items() if k != "trigger_samples_first_300"}, indent=2))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json videoplayback.mp4 > analysis/video-info.json
          ffmpeg -hide_banner -loglevel error -i videoplayback.mp4 -vf "fps=1/2,scale=480:-1,tile=4x4" -frames:v 1 analysis/gameplay-contact-sheet.jpg
          python3 - <<'PY'
          import base64, json, pathlib
          data = base64.b64encode(pathlib.Path("analysis/gameplay-contact-sheet.jpg").read_bytes()).decode("ascii")
          pathlib.Path("analysis/gameplay-contact-sheet-base64.json").write_text(json.dumps({"mime":"image/jpeg","base64":data}), encoding="utf-8")
          PY
      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add detailed Geometry Dash object and gameplay analysis"
          git push origin HEAD:gd-reference-analysis
