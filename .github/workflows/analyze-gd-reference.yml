name: Analyze Geometry Dash reference

on:
  push:
    branches:
      - gd-reference-analysis
    paths-ignore:
      - "analysis/**"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: gd-reference-analysis

      - name: Decode nested level data and sample gameplay
        run: |
          set -euo pipefail
          mkdir -p analysis
          python3 - <<'PY'
          import base64, gzip, pathlib, json, collections, re, xml.etree.ElementTree as ET
          encoded = pathlib.Path("README.md").read_text(encoding="utf-8").strip()
          wrapper = gzip.decompress(base64.b64decode(encoded, altchars=b"-_"))
          pathlib.Path("analysis/decoded-wrapper.plist").write_bytes(wrapper)
          root = ET.fromstring(wrapper)
          dictionary = root.find("dict")
          if dictionary is None:
              raise ValueError("Expected a Geometry Dash plist-style dict")
          children = list(dictionary)
          outer = {}
          for i in range(0, len(children), 2):
              key_node, value_node = children[i], children[i+1]
              key = key_node.text or ""
              if value_node.tag in ("s", "k"):
                  value = value_node.text or ""
              elif value_node.tag in ("i", "r"):
                  value = int(value_node.text or "0")
              elif value_node.tag == "d":
                  value = float(value_node.text or "0")
              elif value_node.tag in ("t", "true"):
                  value = True
              elif value_node.tag in ("f", "false"):
                  value = False
              else:
                  value = ET.tostring(value_node, encoding="unicode")
              outer[key] = value
          level_encoded = outer["k4"]
          level_compressed = base64.b64decode(level_encoded, altchars=b"-_")
          level_raw = gzip.decompress(level_compressed)
          pathlib.Path("analysis/decoded-level.txt").write_bytes(level_raw)
          text = level_raw.decode("utf-8", errors="replace")
          semi_records = text.split(";")
          object_ids = collections.Counter()
          coordinate_samples = []
          valid_records = 0
          for record in semi_records:
              vals = record.split(",")
              if len(vals) >= 6 and len(vals) % 2 == 0:
                  d = dict(zip(vals[::2], vals[1::2]))
                  if "1" in d:
                      object_ids[d["1"]] += 1
                      valid_records += 1
                      if len(coordinate_samples) < 12:
                          coordinate_samples.append({k:d.get(k) for k in ("1","2","3","57","62","64","67","155") if k in d})
          pipe_parts = text.split("|")
          comma_records = [x for x in semi_records if "," in x]
          summary = {
              "wrapper_bytes": len(wrapper),
              "wrapper_keys": sorted(outer.keys()),
              "level_name": outer.get("k2"),
              "level_version": outer.get("kCEK"),
              "inner_encoded_characters": len(level_encoded),
              "inner_compressed_bytes": len(level_compressed),
              "inner_decoded_bytes": len(level_raw),
              "inner_prefix": text[:1500],
              "inner_suffix": text[-1500:],
              "delimiter_counts": {"pipe": text.count("|"), "semicolon": text.count(";"), "comma": text.count(",")},
              "pipe_segment_samples": pipe_parts[:12],
              "first_comma_records": comma_records[:8],
              "last_comma_records": comma_records[-8:],
              "valid_key_value_records": valid_records,
              "object_id_counts_top_100": object_ids.most_common(100),
              "coordinate_samples": coordinate_samples,
          }
          pathlib.Path("analysis/level-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          if [ -f videoplayback.mp4 ]; then
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json videoplayback.mp4 > analysis/video-info.json
            ffmpeg -hide_banner -loglevel error -i videoplayback.mp4 -vf "fps=1/3,scale=320:-1,tile=4x4" -frames:v 1 analysis/gameplay-contact-sheet.jpg
          fi

      - name: Commit extracted reference material to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/
          if git diff --cached --quiet; then
            echo "No analysis output generated."
          else
            git commit -m "Add decoded Geometry Dash reference analysis"
            git push origin HEAD:gd-reference-analysis
          fi
